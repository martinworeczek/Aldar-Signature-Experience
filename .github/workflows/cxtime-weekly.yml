# Aldar CX Times - weekly edition, step 1 of 2: propose.
# Every Monday morning (07:07 Abu Dhabi time) this harvests the past week from the source list,
# screens, enriches and fact-checks with Claude, curates an edition, and opens a pull request
# for review. Nothing is published here. Approval happens in the review workflow (cxtime-review.yml).
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANTHROPIC_API_KEY   required
#   NETLIFY_AUTH_TOKEN  optional here: enables a live preview link of the proposed edition
name: "CX Times · weekly edition"

on:
  schedule:
    - cron: "7 3 * * 1"   # Mondays 03:07 UTC = 07:07 Gulf Standard Time
  workflow_dispatch:
    inputs:
      date:
        description: "Run date (YYYY-MM-DD). Leave empty for today."
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cxtime-edition
  cancel-in-progress: false

env:
  CX_SITE_ID: 10f3e254-e662-4a56-834f-8186e584a2d8

defaults:
  run:
    shell: bash   # adds pipefail, so a failing step behind `| tee` still fails

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: One edition at a time
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --label cxtime-edition --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body "This week's run was skipped because this edition is still waiting for review. Reply \`/approve\` to publish it, or close this pull request so the next Monday run starts fresh."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run date and branch
        if: steps.open.outputs.skip != 'true'
        id: meta
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          d="${INPUT_DATE:-$(date -u +%F)}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date: $d"; exit 1; }
          echo "date=$d" >> "$GITHUB_OUTPUT"
          echo "branch=cxtime/edition-$d-run$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"   # unique per run, so a rerun never collides

      - uses: actions/setup-python@v5
        if: steps.open.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        if: steps.open.outputs.skip != 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Harvest, enrich, fact-check, curate
        if: steps.open.outputs.skip != 'true'
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CXTIME_IMG_BASE: https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.branch }}
        run: |
          git switch -c "${{ steps.meta.outputs.branch }}"
          python pipeline/run.py check
          python pipeline/run.py propose --date "${{ steps.meta.outputs.date }}"

      - name: Preview link
        if: steps.open.outputs.skip != 'true'
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          CXTIME_IMG_BASE: https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.branch }}
        run: |
          [ -n "$NETLIFY_AUTH_TOKEN" ] || { echo "no Netlify token: preview skipped"; exit 0; }
          python pipeline/run.py preview "$RUNNER_TEMP/preview"
          url=$(npx -y netlify-cli@17 deploy --dir "$RUNNER_TEMP/preview" --site "$CX_SITE_ID" \
                --alias "edition-${{ steps.run.outputs.edition }}" --message "Proposed edition ${{ steps.run.outputs.edition }}" --json | jq -r '.deploy_url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          CXTIME_PREVIEW_URL="$url" python pipeline/run.py review --date "${{ steps.meta.outputs.date }}"

      - name: Open the review pull request
        if: steps.open.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "Aldar CX Times bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          git commit -m "CX Times: proposed Edition ${{ steps.run.outputs.edition }} (${{ steps.meta.outputs.date }})

          Weekly run: harvest, screen, enrich and fact-check, curated into a proposal.
          Not published: the archive and both sites change only after /approve."
          git push -u origin "${{ steps.meta.outputs.branch }}"
          gh label create cxtime-edition --color E8B96A --description "Aldar CX Times weekly edition" --force
          hold=""; [ "${{ steps.run.outputs.hold }}" = "true" ] && hold=" · HOLD"
          gh pr create --base main --head "${{ steps.meta.outputs.branch }}" --label cxtime-edition \
            --title "Aldar CX Times · Edition ${{ steps.run.outputs.edition }} · ${{ steps.meta.outputs.date }}${hold}" \
            --body-file "${{ steps.run.outputs.run_dir }}/pr-body.md"
