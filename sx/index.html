<style>
:root{
  --bg:#070c10;--panel:#0d151b;--panel2:#111b22;--line:#1e2a33;--line2:#2a3843;
  --ink:#eef1f3;--ink2:#aeb8c0;--ink3:#7c8892;--gold:#c9a24a;--gold2:#ebd9ae;--goldbg:rgba(201,162,74,.12);
  --ok:#3fae74;--okbg:rgba(63,174,116,.13);--warn:#d9a441;--warnbg:rgba(217,164,65,.13);--bad:#d36b6b;--badbg:rgba(211,107,107,.13);--info:#5b8fd6;--infobg:rgba(91,143,214,.13);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
header.top{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,12,16,.92);backdrop-filter:blur(10px);z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.15;text-decoration:none;color:var(--ink)}
.brand b{font-weight:600;font-size:14px}.brand span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mark{width:34px;height:34px;border:1px solid var(--line2);border-radius:9px;display:grid;place-items:center;color:var(--gold);font-weight:700}
.top .sp{flex:1}
.who{font-size:12px;color:var(--ink2);text-align:right;line-height:1.3}.who b{color:var(--ink);font-weight:600;display:block}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--ink);border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#3a4b57}.btn:disabled{opacity:.5;cursor:default}
.btn.gold{background:linear-gradient(180deg,#d9b560,#c29a42);color:#0a1014;border-color:transparent;font-weight:600}
.btn.ok{background:var(--ok);border-color:transparent;color:#06140c;font-weight:600}
.btn.bad{color:#f2b1b1;border-color:#5b3434}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12px}
h1{font-weight:500;font-size:28px;margin:34px 0 6px;letter-spacing:-.01em}
h2{font-weight:600;font-size:16px;margin:0 0 12px}
.lede{color:var(--ink2);margin:0 0 24px;max-width:720px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{background:transparent;border:1px solid transparent;color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
.tab.on{background:var(--goldbg);color:var(--gold2);border-color:rgba(201,162,74,.35)}
.tab .n{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--gold);color:#0a1014;font-size:11px;font-weight:700;margin-left:6px;text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.list{display:grid;gap:10px}
.row{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none;color:inherit}
.row:hover{border-color:var(--line2)}
.thumb{width:64px;height:48px;border-radius:8px;object-fit:cover;background:var(--panel2);flex-shrink:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t span{color:var(--ink3);font-size:12px}
.chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-pending{background:var(--warnbg);color:var(--warn)}.c-returned{background:var(--infobg);color:#8fb4ea}.c-approved{background:var(--okbg);color:#7bd3a3}.c-rejected,.c-unpublished{background:var(--badbg);color:#eaa0a0}.c-withdrawn{background:var(--panel2);color:var(--ink3)}
.kind{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.empty{color:var(--ink3);padding:30px;text-align:center;border:1px dashed var(--line2);border-radius:12px}
label.f{display:block;margin:0 0 16px}
label.f>span,.flabel{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px}
label.f>span i,.flabel i{font-style:normal;font-weight:400;color:var(--ink3)}
input[type=text],input[type=url],input[type=email],input[type=month],input[type=password],select,textarea{width:100%;background:#0a1116;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:96px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:720px){.two{grid-template-columns:1fr}h1{font-size:23px}.who{display:none}}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line2);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:12.5px;background:#0a1116;user-select:none}
.pill.on{border-color:var(--gold);background:var(--goldbg);color:var(--gold2)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.asset{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:#0a1116;font-size:12.5px}
.asset.on{border-color:rgba(201,162,74,.5)}
.asset .nm{flex:1;cursor:pointer}
.asset .lv{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);cursor:pointer;color:var(--ink3)}
.asset .lv.on{background:var(--okbg);color:#7bd3a3;border-color:transparent}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;margin:0 0 16px;font-size:13px}
.check input{width:16px;height:16px;accent-color:var(--gold)}
.photo{display:flex;gap:14px;align-items:center}
.photo img{width:150px;height:100px;object-fit:cover;border-radius:10px;background:var(--panel2);border:1px solid var(--line2)}
.hint{font-size:12px;color:var(--ink3);margin-top:6px}
.warnbox{background:var(--warnbg);border:1px solid rgba(217,164,65,.35);color:#f0cf8a;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:-6px 0 16px}
.errbox{background:var(--badbg);border:1px solid rgba(211,107,107,.4);color:#f2b8b8;border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 16px}
.okbox{background:var(--okbg);border:1px solid rgba(63,174,116,.35);color:#a9e3c3;border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sep{height:1px;background:var(--line);margin:22px 0}
.preview{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
@media (max-width:820px){.preview{grid-template-columns:1fr}}
.preview img.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--panel2)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--ink3)}.kv dd{margin:0}
.diff{display:grid;grid-template-columns:140px 1fr 1fr;gap:6px 14px;font-size:13px;align-items:start}
.diff .h{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.diff .old{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.diff .new{color:var(--gold2)}
.hist{font-size:12.5px;color:var(--ink2);display:grid;gap:6px}
.hist b{color:var(--ink);font-weight:600}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:#0a1116;border:1px solid var(--line2);border-radius:8px;padding:5px 9px;letter-spacing:.02em}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t input{padding:7px 9px}
.scroll{overflow-x:auto}
.login{max-width:420px;margin:12vh auto 0}
.muted{color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2730;border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters select,.filters input{width:auto;min-width:160px}
ol.steps{padding-left:18px;color:var(--ink2);font-size:13px}ol.steps li{margin-bottom:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--gold);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><b>Signature Experience Hub</b><span>Submit &amp; review</span></a>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="btn ghost sm" id="signout" hidden>Sign out</button>
  <a class="btn sm" href="/">Back to the hub</a>
</header>
<main class="wrap" id="app"><div class="login"><span class="spin"></span></div></main>

<script>
(function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var app = $("#app");
  var S = { code: "", me: null, subs: [], tab: "", editing: null };
  var STATUS = { pending: "Waiting for review", returned: "Changes requested", approved: "Published", rejected: "Not approved", withdrawn: "Withdrawn", unpublished: "Unpublished" };
  var STAGE = { rev: "In Review", impl: "In Implementation", live: "Deployed & Live", dep: "Backlog (2027)", disc: "Discontinued" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function toast(msg) { var t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function fmtDate(iso) { if (!iso) return ""; var d = new Date(iso); return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }
  function monthLabel(t) { var m = /^(\d{4})-(\d{2})$/.exec(t || ""); if (!m) return "TBC"; return new Date(+m[1], +m[2] - 1, 1).toLocaleDateString("en-GB", { month: "short", year: "numeric" }); }
  function lineLabel(l) { var o = S.me && S.me.options[l]; return o ? o.label : l; }

  function api(path, opt) {
    opt = opt || {};
    var h = { "x-sx-code": S.code };
    if (opt.body && !(opt.body instanceof Blob)) { h["content-type"] = "application/json"; opt.body = JSON.stringify(opt.body); }
    if (opt.type) h["content-type"] = opt.type;
    return fetch("/api/sx/" + path, { method: opt.method || (opt.body ? "POST" : "GET"), headers: h, body: opt.body }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) { var e = new Error(j.error || ("Request failed (" + r.status + ")")); e.status = r.status; throw e; } return j; });
    });
  }

  // ---------- sign in ----------
  function loginView(err) {
    $("#who").innerHTML = ""; $("#signout").hidden = true;
    app.innerHTML = '<div class="login card"><h2 style="font-size:20px;font-weight:500">Submit &amp; review</h2>' +
      '<p class="muted" style="margin-top:0">Business-line leads submit new signature experiences and updates here. Group CX reviews every one before it appears on the hub.</p>' +
      (err ? '<div class="errbox">' + esc(err) + '</div>' : '') +
      '<form id="lf"><label class="f"><span>Access code</span><input type="password" id="code" autocomplete="current-password" placeholder="e.g. HP-XXXX-XXXX-XXXX" required></label>' +
      '<label class="check"><input type="checkbox" id="rem" checked> Remember me on this device</label>' +
      '<button class="btn gold" style="width:100%;justify-content:center">Sign in</button></form>' +
      '<p class="hint">No code? Ask Group CX for your business line\'s access code.</p></div>';
    $("#lf").onsubmit = function (e) { e.preventDefault(); signIn($("#code").value.trim(), $("#rem").checked); };
    $("#code").focus();
  }
  function signIn(code, remember) {
    S.code = code;
    app.innerHTML = '<div class="login"><span class="spin"></span></div>';
    api("session", { method: "POST" }).then(function (me) {
      S.me = me; if (remember) store("sx_code", code);
      $("#who").innerHTML = "<b>" + esc(me.name) + "</b>" + (me.role === "reviewer" ? "Reviewer · Group CX" : esc(lineLabel(me.line)) + " lead");
      $("#signout").hidden = false;
      return loadSubs().then(route);
    }).catch(function (e) { store("sx_code", null); S.code = ""; loginView(e.message); });
  }
  $("#signout").onclick = function () { store("sx_code", null); S.code = ""; S.me = null; location.hash = ""; loginView(); };
  function loadSubs() { return api("submissions").then(function (j) { S.subs = j.submissions || []; }); }
  function refreshSession() { return api("session", { method: "POST" }).then(function (me) { S.me = me; }); }

  // ---------- routing ----------
  window.addEventListener("hashchange", function () { if (S.me) route(); });
  function route() {
    var h = location.hash.replace(/^#/, "").split("/");
    var rev = S.me.role === "reviewer";
    if ((h[0] === "review" || h[0] === "mine" || h[0] === "s") && h[1]) { var s = S.subs.filter(function (x) { return x.id === h[1]; })[0]; if (s) return detailView(s); }
    var tab = h[0] || (rev ? "queue" : "mine");
    S.tab = tab;
    if (rev) {
      if (tab === "all") return shell(allView());
      if (tab === "leads") return shell(leadsView(), bindLeads);
      if (tab === "notify") return shell(notifyView(), bindNotify);
      return shell(queueView());
    }
    if (tab === "new") return shell(formHTML("new"), function () { bindForm("new"); });
    if (tab === "update") return shell(updatePicker(), bindUpdatePicker);
    return shell(mineView());
  }
  function shell(inner, bind) {
    var rev = S.me.role === "reviewer";
    var pending = S.subs.filter(function (s) { return s.status === "pending"; }).length;
    var tabs = rev
      ? [["queue", "Review queue", pending], ["all", "All submissions"], ["leads", "Leads & access codes"], ["notify", "Notifications"]]
      : [["mine", "My submissions"], ["new", "New experience"], ["update", "Update an experience"]];
    var title = rev ? "Review submissions" : lineLabel(S.me.line);
    var lede = rev ? "Everything business-line leads submit waits here for your decision. Approved experiences and updates appear on the hub, and in CX Martin, straight away."
      : "Submit a new signature experience, or an update to one of yours. Group CX reviews each submission before it is published to the hub.";
    app.innerHTML = "<h1>" + esc(title) + '</h1><p class="lede">' + lede + '</p><div class="tabs">' +
      tabs.map(function (t) { return '<button class="tab' + (S.tab === t[0] ? " on" : "") + '" data-t="' + t[0] + '">' + t[1] + (t[2] ? '<span class="n">' + t[2] + "</span>" : "") + "</button>"; }).join("") +
      "</div>" + inner;
    app.querySelectorAll(".tab").forEach(function (b) { b.onclick = function () { location.hash = b.dataset.t; }; });
    if (bind) bind();
    window.scrollTo(0, 0);
  }

  // ---------- lists ----------
  function subRow(s) {
    var f = s.fields || {};
    var exp = s.kind === "update" ? (S.me.experiences.filter(function (e) { return e.id === s.exp_id; })[0] || {}) : {};
    var img = f.photo || exp.image_url || "";
    var name = s.kind === "new" ? f.name : (s.exp_name || exp.name || s.exp_id);
    return '<a class="row" href="#s/' + esc(s.id) + '">' + (img ? '<img class="thumb" src="' + esc(img) + '" alt="" loading="lazy">' : '<div class="thumb"></div>') +
      '<div class="t"><div class="kind">' + (s.kind === "new" ? "New experience" : "Update") + (S.me.role === "reviewer" ? " · " + esc(lineLabel(s.line)) : "") + '</div><b>' + esc(name) + '</b><span>' +
      (S.me.role === "reviewer" ? esc(s.lead) + " · " : "") + "Updated " + esc(fmtDate(s.updated_at)) + "</span></div>" +
      '<span class="chip c-' + s.status + '">' + STATUS[s.status] + "</span></a>";
  }
  function mineView() {
    if (!S.subs.length) return '<div class="empty">Nothing submitted yet. <a href="#new">Submit a new experience</a> or <a href="#update">update an existing one</a>.</div>';
    var ret = S.subs.filter(function (s) { return s.status === "returned"; });
    return (ret.length ? '<div class="warnbox">' + ret.length + " submission" + (ret.length > 1 ? "s need" : " needs") + " changes. Open " + (ret.length > 1 ? "them" : "it") + " to see Group CX's comment and resubmit.</div>" : "") +
      '<div class="list">' + S.subs.map(subRow).join("") + "</div>";
  }
  function queueView() {
    var p = S.subs.filter(function (s) { return s.status === "pending"; }).sort(function (a, b) { return String(a.updated_at).localeCompare(String(b.updated_at)); });
    return p.length ? '<div class="list">' + p.map(subRow).join("") + "</div>" : '<div class="empty">Nothing waiting for review.</div>';
  }
  function allView() {
    setTimeout(function () {
      var run = function () {
        var l = $("#fl").value, st = $("#fs").value, q = $("#fq").value.toLowerCase();
        var list = S.subs.filter(function (s) { var f = s.fields || {}; return (!l || s.line === l) && (!st || s.status === st) && (!q || JSON.stringify([f.name, s.exp_name, s.lead, f.note]).toLowerCase().indexOf(q) >= 0); });
        $("#fr").innerHTML = list.length ? list.map(subRow).join("") : '<div class="empty">No submissions match.</div>';
      };
      ["#fl", "#fs", "#fq"].forEach(function (id) { $(id).oninput = run; }); run();
    });
    return '<div class="filters"><select id="fl"><option value="">All lines</option>' + Object.keys(S.me.options).map(function (l) { return '<option value="' + l + '">' + esc(lineLabel(l)) + "</option>"; }).join("") +
      '</select><select id="fs"><option value="">Any status</option>' + Object.keys(STATUS).map(function (k) { return '<option value="' + k + '">' + STATUS[k] + "</option>"; }).join("") +
      '</select><input type="text" id="fq" placeholder="Search"></div><div class="list" id="fr"></div>';
  }

  // ---------- detail ----------
  function detailView(s) {
    var rev = S.me.role === "reviewer", f = s.fields || {}, O = S.me.options[s.line];
    var exp = S.me.experiences.filter(function (e) { return e.id === s.exp_id; })[0] || {};
    var pillar = (O.pillars.filter(function (p) { return p.id === f.pillar; })[0] || {}).name;
    var journey = ((O.journeys || []).filter(function (j) { return j.id === f.journey; })[0] || {}).name;
    var type = ((O.types || []).filter(function (t) { return t.id === f.type; })[0] || {}).label;
    var assets = (f.assets || []).map(function (a) { return esc(a.name) + (a.live ? ' <span class="chip c-approved" style="padding:1px 7px">live</span>' : ""); }).join(", ");
    var body;
    if (s.kind === "new") {

        var need = w.length <= 2 ? w.length : Math.ceil(w.length * 0.6);
        var hits = mine.map(function (e) { var ew = words(e.name); var n = w.filter(function (x) { return ew.indexOf(x) >= 0; }).length; return [n, e]; }).filter(function (x) { return x[0] >= need; }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, 3);
        $("#dup").innerHTML = hits.length ? '<div class="warnbox">Similar experiences already exist: ' + hits.map(function (x) { return "<b>" + esc(x[1].name) + "</b> (" + esc(x[1].stage) + ")"; }).join(", ") + ". If it's one of these, <a href=\"#update\">submit an update</a> instead.</div>" : "";
      };
    }
    // photo
    var pf = $("#pfile");
    if (pf) pf.onchange = function () {
      var file = pf.files[0]; if (!file) return;
      $("#pstat").innerHTML = '<span class="spin"></span> Uploading…';
      resize(file).then(function (blob) { return api("photo", { method: "POST", body: blob, type: "image/jpeg" }); }).then(function (j) {
        fe("photo").value = j.url; var im = $("#pimg"); im.src = j.url; im.style.visibility = ""; $("#pstat").textContent = "Uploaded.";
      }).catch(function (e) { $("#pstat").textContent = e.message; });
    };
    form.onsubmit = function (ev) {
      ev.preventDefault();
      var f = {};
      ["name", "essence", "narrative", "pillar", "journey", "type", "group", "cadence", "capex", "evp", "segment", "target", "moment", "customer_benefit", "aldar_benefit", "note", "photo", "folder_url"].forEach(function (k) { var el = fe(k); if (el && el.value !== undefined) f[k] = el.value.trim(); });
      if (fe("defining")) f.defining = fe("defining").checked;
      if (fe("touchpoints")) f.touchpoints = fe("touchpoints").value.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
      form.querySelectorAll("[data-multi]").forEach(function (g) { f[g.dataset.multi] = [].map.call(g.querySelectorAll(".pill.on"), function (p) { return p.dataset.v; }); });
      f.stage = stageNow();
      if (!(f.stage === "rev" || f.stage === "impl")) delete f.target;
      if (form.querySelector("#assets")) f.assets = [].filter.call(form.querySelectorAll(".asset"), function (a) { return a.querySelector("input").checked; }).map(function (a) { return { name: a.dataset.n, live: f.stage === "live" && a.querySelector(".lv").classList.contains("on") }; });
      if (kind === "update") { Object.keys(f).forEach(function (k) { if (f[k] === "") delete f[k]; }); }
      var btn = form.querySelector("[type=submit]"); btn.disabled = true; var old = btn.innerHTML; btn.innerHTML = '<span class="spin"></span> Sending…';
      var p = onSubmit ? Promise.resolve(onSubmit(f)) : api("submissions", { body: { kind: kind, line: line, exp_id: expId, fields: f } }).then(function (j) {
        toast("Submitted. Group CX will review it" + (j.notified ? " and has been notified." : "."));
        return loadSubs().then(function () { location.hash = "mine"; route(); });
      });
      p.catch(function (e) { $("#ferr").innerHTML = '<div class="errbox">' + esc(e.message) + "</div>"; $("#ferr").scrollIntoView({ behavior: "smooth", block: "center" }); btn.disabled = false; btn.innerHTML = old; });
    };
  }

  // ---------- reviewer: leads ----------
  function leadsView() {
    var L = S.me.leads || {};
    return '<div class="card"><p class="muted" style="margin-top:0">One lead per business line. Share each code privately with that lead; they sign in at <b>' + esc(location.origin) + '/sx/</b>. Regenerate a code to revoke the old one straight away.</p><div class="scroll"><table class="t"><thead><tr><th>Line</th><th>Lead name</th><th>Email <span style="text-transform:none;letter-spacing:0">(decision emails)</span></th><th>Access code</th><th></th></tr></thead><tbody>' +
      Object.keys(S.me.options).map(function (l) {
        var x = L[l] || {};
        return '<tr data-l="' + l + '"><td style="white-space:nowrap">' + esc(lineLabel(l)) + '</td><td><input type="text" data-k="name" value="' + esc(x.name) + '" placeholder="Name"></td><td><input type="email" data-k="email" value="' + esc(x.email) + '" placeholder="name@aldar.com"></td>' +
          '<td style="white-space:nowrap"><span class="code">' + esc(x.code) + '</span> <button class="btn sm ghost" data-a="copy">Copy</button></td><td style="white-space:nowrap"><button class="btn sm" data-a="save">Save</button> <button class="btn sm bad" data-a="regen">New code</button></td></tr>';
      }).join("") + "</tbody></table></div></div>";
  }
  function bindLeads() {
    app.querySelectorAll("tr[data-l]").forEach(function (tr) {
      var l = tr.dataset.l;
      tr.querySelector('[data-a="copy"]').onclick = function () { var c = (S.me.leads[l] || {}).code; (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(function () { toast("Code copied"); }, function () { prompt("Copy the code:", c); }); };
      tr.querySelector('[data-a="save"]').onclick = function () { save({ line: l, name: tr.querySelector('[data-k="name"]').value, email: tr.querySelector('[data-k="email"]').value }, "Saved"); };
      tr.querySelector('[data-a="regen"]').onclick = function () { if (confirm("Issue a new code for " + lineLabel(l) + "? The old code stops working immediately.")) save({ line: l, regenerate: true }, "New code issued"); };
    });
    function save(body, msg) { api("leads", { body: body }).then(function (j) { S.me.leads = j.leads; toast(msg); route(); }).catch(function (e) { toast(e.message); }); }
  }
  // ---------- reviewer: notifications ----------
  function notifyView() {
    var s = S.me.settings || {};
    return '<div class="card"><label class="f"><span>Your name <i>· shown to leads on decisions</i></span><input type="text" id="rn" value="' + esc(s.reviewer_name || "Group CX") + '"></label>' +
      '<label class="f"><span>Your email <i>· new submissions are emailed here</i></span><input type="email" id="re" value="' + esc(s.reviewer_email) + '" placeholder="name@aldar.com"></label>' +
      '<label class="f"><span>Teams workflow webhook URL</span><input type="url" id="tw" value="' + esc(s.teams_webhook) + '" placeholder="https://…logic.azure.com/… or https://…powerplatform.com/…"></label>' +
      '<div class="actions"><button class="btn gold" id="ns">Save</button><button class="btn" id="nt">Save and send a test</button></div>' +
      '<div class="sep"></div><h2>Setting up the Teams workflow (once, about 5 minutes)</h2><ol class="steps">' +
      "<li>In Teams, open the channel or chat where you want alerts, choose <b>…</b> → <b>Workflows</b>, and pick the template <b>“Send webhook alerts to a channel”</b> (or <b>“…to a chat”</b>).</li>" +
      "<li>Name it “Signature Experience Hub”, choose where it posts, and create it. Copy the <b>webhook URL</b> it shows, paste it above and click <b>Save and send a test</b>. The card should appear in Teams.</li>" +
      "<li>For email too: open the workflow in Power Automate (Teams → Workflows → Edit), add a step after the trigger: <b>Office 365 Outlook → Send an email (V2)</b>. Set <b>To</b> = <code class=\"code\">triggerBody()?['email_to']</code>, <b>Subject</b> = <code class=\"code\">triggerBody()?['subject']</code>, <b>Body</b> = <code class=\"code\">triggerBody()?['html']</code>. Save.</li>" +
      "<li>New submissions are emailed to you. Decisions (approved, sent back, rejected) are emailed to that line's lead, using the email on the <a href=\"#leads\">Leads</a> tab.</li></ol></div>";
  }
  function bindNotify() {
    var go = function (test) {
      api("settings", { body: { reviewer_name: $("#rn").value, reviewer_email: $("#re").value, teams_webhook: $("#tw").value, test: test } }).then(function (j) {
        S.me.settings = j.settings;
        toast(test ? (j.test && j.test.sent ? "Saved. Test sent: check Teams." : "Saved, but the test didn't go through: " + ((j.test && (j.test.reason || ("status " + j.test.status))) || "")) : "Saved");
      }).catch(function (e) { toast(e.message); });
    };
    $("#ns").onclick = function () { go(false); }; $("#nt").onclick = function () { go(true); };
  }

  // ---------- start ----------
  var saved = store("sx_code");
  if (saved) signIn(saved, true); else loginView();
})();
</script>
</body>
</html>
