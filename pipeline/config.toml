# Aldar CX Time - weekly edition pipeline settings.
# The editorial rules live here so they can be changed without touching the code.
# Sources are a curated, global allow-list. Nothing outside this file is ever fetched.

[edition]
name = "Aldar CX Time"
window_days = 7              # harvest window: what each source published in the last 7 days
fallback_items = 3           # a source with nothing new offers its newest items instead...
fallback_max_age_days = 30   # ...but never older than this
caps = { read = 6, watch = 3, listen = 3 }   # ceilings, not quotas
min_items = 5                # below this the edition is held, not padded
min_relevance = 3            # 1-5, strategic relevance to Aldar (with experiential >= 4)
min_experiential = 4         # 1-5, how squarely the story is about a lived customer experience
lead_min_relevance = 5
max_per_source = 2           # no single masthead dominates an edition
max_ai_tech = 2              # AI stories only when applied to an experience, and at most this many
shortlist = { read = 18, watch = 6, listen = 6 }   # stories actually read in full and enriched; headroom above the caps
shortlist_per_source = 4     # no source takes more than this many shortlist places

[models]
# One model for every step by default; change here if cost needs tuning.
screen = "claude-opus-5-5"
enrich = "claude-opus-5-5"
verify = "claude-opus-5-5"
screen_effort = "low"
enrich_effort = "high"
verify_effort = "high"

[fetch]
user_agent = "AldarCXTimeBot/1.0 (+https://aldar-cx-time.netlify.app; Group CX editorial digest)"
timeout = 25
delay_seconds = 1.5          # politeness gap between requests to the same host
min_read_words = 250         # less accessible text than this = paywalled or a stub: dropped
max_source_chars = 60000

[images]
max_long_edge = 1200
max_kb = 180
min_width = 600              # smaller originals look soft behind the scrims: fall back to the gradient
aspect = 1.7778              # 16:9 crop

# ---------------------------------------------------------------------------------------
# Tag palette. tag = the subject; colours as already used by Editions 1-2.
[tags]
"Hospitality" = { ink = "#9A7530", chip = "#E8B96A", a = "#9A7530", b = "#5E4518" }
"Retail"      = { ink = "#A65A5A", chip = "#D89A9A", a = "#844747", b = "#472626" }
"Education"   = { ink = "#4E7C6A", chip = "#9FC2B4", a = "#4E7C6A", b = "#2C4A3E" }
"Development" = { ink = "#8A6D4B", chip = "#D8C3A0", a = "#6E5638", b = "#3E301F" }
"Workplace"   = { ink = "#4A5A6E", chip = "#C7CFD8", a = "#4A5A6E", b = "#2E3A48" }
"AI & Tech"   = { ink = "#2E6F9E", chip = "#8FC0DE", a = "#1F3A4D", b = "#12222E" }
"Design"      = { ink = "#A8663F", chip = "#E0B090", a = "#8A5533", b = "#4E301C" }
"Foresight"   = { ink = "#5D5A8C", chip = "#B6B3D8", a = "#4A4770", b = "#2A2842" }
"Portfolio"   = { ink = "#B0863F", chip = "#E8B96A", a = "#8A6730", b = "#4E3A1B" }

