[build]
  publish = "."
  # keep the hub hooked up to approved submissions (idempotent), then rebuild the MCP
  # dataset from index.html on every deploy, so /mcp always matches the site
  command = "python3 tools/apply_sx_hook.py && python3 tools/apply_app_meta.py && python3 tools/apply_features.py && node tools/build_mcp_data.mjs"

[functions]
  node_bundler = "esbuild"

# Images are named by content hash, so a file never changes once published.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"
