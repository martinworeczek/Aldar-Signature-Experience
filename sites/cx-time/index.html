34px}}\n\n/* Phones and small tablets. The module is laid out with inline styles for the desktop hub,\n   so these rules reach it through the data-m hooks that MOBILE_HOOKS adds at build time. */\n@media (max-width:900px){\n [data-m=rail]{grid-template-columns:repeat(2,minmax(0,1fr))!important}\n}\n@media (max-width:700px){\n .atl{border-radius:0!important;min-height:0!important}\n [data-m=pad]{padding:12px 12px 40px!important}\n [data-atl-masthead]{border-radius:16px!important;margin-bottom:18px!important}\n [data-m=mh]{padding:58px 18px 20px!important;min-height:0!important}\n [data-m=mh] [data-atl-edpill] > div > div[style*=\"absolute\"]{right:auto!important;left:50%!important;transform:translateX(-50%);width:min(280px,calc(100vw - 48px))!important}\n [data-m=stats]{gap:10px 22px!important}\n [data-m=strip]{flex-direction:column!important;margin-top:18px!important}\n [data-m=strip] > div{border-right:0!important;border-bottom:1px solid rgba(247,242,233,.12);padding:11px 16px 12px!important}\n [data-m=strip] > div:last-child{border-bottom:0}\n [data-m=shelf]{padding:16px 12px 22px!important;border-radius:16px!important}\n [data-atl-lead]{aspect-ratio:auto!important;min-height:440px!important;display:flex;flex-direction:column;justify-content:flex-end;margin-top:4px!important}\n [data-m=leadchips]{left:14px!important;right:14px!important;top:14px!important;flex-wrap:wrap!important}\n [data-m=leadtx]{position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;padding:84px 18px 20px}\n [data-m=leadtx] > div:last-child{flex-wrap:wrap}\n [data-m=grid]{grid-template-columns:minmax(0,1fr)!important;gap:12px!important}\n [data-m=grid] [data-atl-card]{aspect-ratio:4/5!important}\n [data-atl-row]{grid-template-columns:92px minmax(0,1fr)!important;gap:14px!important;padding:14px 0!important}\n [data-atl-row] > span:last-child{display:none!important}\n [data-atl-row] > div:nth-child(2) > div:nth-child(2){font-size:16px!important}\n [data-atl-rea e}}\n@keyframes atlpulse{0%,100%{opacity:.5}50%{opacity:1}}\n.atl-view{animation:atlfade .34s ease both}\n  @keyframes atlKen { from { transform: scale(1.05) } to { transform: scale(1.13) } }\n  @keyframes atlDrift { from { transform: translate3d(0,0,0) scale(1.02) } to { transform: translate3d(-2%,-1.5%,0) scale(1.06) } }\n  @keyframes atlSlide { from { transform: translateX(0) } to { transform: translateX(-50%) } }\n  @keyframes atlWave { 0%,100% { transform: scaleY(.34); opacity: .5 } 50% { transform: scaleY(1); opacity: 1 } }\n  @keyframes atlPop { 0%,100% { opacity: .3; transform: scale(.88) } 45% { opacity: 1; transform: scale(1) } }\n  /* The edition pill is absolutely positioned at the hero's top right, so it reserves no\n     horizontal space; the headline is centred across the FULL hero width and runs under it\n     once the column narrows (measured: 42px of overlap at a 924px viewport with the sidebar\n     collapsed). Below the width where they clear each other the pill drops into the flow\n     above the eyebrow instead. It stays position:relative rather than static so the\n     editions dropdown still anchors to the pill and not to the hero.\n     The breakpoint is on the VIEWPORT but the collision depends on the hero WRAPPER, which\n     is roughly viewport minus the sidebar (~230px expanded) minus 56px of padding \u2014 so\n     1400px is the first viewport width at which the wrapper (~1115px) clears the pill by a\n     comfortable margin even with the sidebar open. A lower breakpoint looks safe and is not. */\n  @media (max-width: 1400px) {\n    [data-atl-edpill] { position: relative !important; right: auto !important; top: auto !important; margin: 0 auto 16px !important; text-align: center !important; }\n    [data-atl-edpill] > div { text-align: center !important; }\n    [data-atl-edpill] > div > div { align-items: center !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"cxt-bar\">\n  <a class=\"cxt-brand\" href=\"./\" title=\"Aldar CX Time\">\n    <img src=\"1271cd60-c04e-4fd0-ab14-052455662e03\" alt=\"Aldar\">\n    <span><b>Aldar CX Time<\u002Fb><i>Curated by Group CX<\u002Fi><\u002Fspan>\n  <\u002Fa>\n  <a class=\"cxt-hub\" href=\"https://aldar-signature-experience.netlify.app/\" target=\"_blank\" rel=\"noopener\"><span class=\"cxt-long\">Signature Experience <\u002Fspan>Hub \u2197<\u002Fa>\n<\u002Fdiv>\n<div class=\"cxt-page\">\n\n\n\n<div class=\"atl\" style=\"position:relative;background:{{ bg }};border-radius:22px;transition:background .6s ease;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;min-height:1000px\">\n  <div data-m=\"pad\" style=\"position:relative;z-index:1;max-width:none;margin:0;padding:26px 28px 80px\">\n\n    <!-- ============ HOME \u00b7 charcoal ============ -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div class=\"atl-view\" style=\"color:#F7F2E9\">\n      <div data-atl-masthead=\"1\" style=\"position:relative;min-height:400px;border-radius:20px;overflow:hidden;border:1px solid rgba(232,185,106,.26);background:#0A1014;margin:0 0 30px;box-shadow:0 30px 70px -34px rgba(0,0,0,.85)\">\n        <div style=\"position:absolute;inset:0;background:radial-gradient(circle at 50% 56%,#16212B,#090E12 72%)\"><\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:0;height:42px;overflow:hidden;border-bottom:1px solid rgba(232,185,106,.18)\">\n          <div style=\"display:flex;gap:34px;width:200%;align-items:center;height:100%;padding-left:26px;animation:atlSlide 44s linear infinite\">\n            <sc-for list=\"{{ ticker }}\" as=\"tk\" hint-placeholder-count=\"14\">\n              <span style=\"{{ tk.css }}\">{{ tk.text }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;gap:6px;height:132px\">\n          <sc-for list=\"{{ waveBars }}\" as=\"wb\" hint-placeholder-count=\"48\">\n            <div style=\"{{ wb.css }}\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:none\">\n          <sc-for list=\"{{ pinned }}\" as=\"p\" hint-placeholder-count=\"7\">\n            <div style=\"{{ p.card }}\">\n              <span style=\"{{ p.glyphCss }}\">{{ p.glyph }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"{{ p.labelCss }}\">{{ p.label }}<\u002Fdiv>\n                <div style=\"{{ p.lineCss }}\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:radial-gradient(circle at 22% 18%,rgba(201,162,74,.16),transparent 62%)\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:radial-gradient(62% 56% at 50% 50%,rgba(11,20,27,.92),rgba(11,20,27,.62) 62%,rgba(11,20,27,.24))\"><\u002Fdiv>\n        <div data-m=\"mh\" style=\"position:relative;min-height:400px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:46px 44px 22px;box-sizing:border-box\">\n          <div data-atl-edpill=\"1\" style=\"position:absolute;right:20px;top:52px;z-index:22;text-align:right\">\n          <div style=\"text-align:right;white-space:nowrap;background:rgba(11,20,27,.82);border:1px solid rgba(232,185,106,.3);border-radius:999px;padding:6px 14px\">\n          <div sc-camel-on-click=\"{{ toggleArchive }}\" style=\"cursor:pointer;display:inline-flex;flex-direction:column;align-items:flex-end;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8B8271;line-height:1.9;user-select:none\">\n            <span style=\"display:inline-flex;align-items:center;gap:6px;color:#E8B96A;font-weight:700;white-space:nowrap\">{{ edLabel }} <span style=\"font-size:8px\">\u25be<\u002Fspan><\u002Fspan>\n            <span style=\"color:#6E6656\">{{ edSub }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ archiveOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div sc-camel-on-click=\"{{ toggleArchive }}\" style=\"position:fixed;inset:0;z-index:15\"><\u002Fdiv>\n            <div style=\"position:absolute;right:0;top:100%;margin-top:10px;z-index:20;width:280px;background:#1E1810;border:1px solid rgba(232,185,106,.3);border-radius:14px;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);overflow:hidden;text-align:left\">\n              <div style=\"padding:13px 16px;border-bottom:1px solid rgba(232,185,106,.16);display:flex;align-items:center;justify-content:space-between\">\n                <span style=\"font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#B0863F\">Editions archive<\u002Fspan>\n                <span style=\"font-size:8.5px;color:#6E6656\">Every past edition, kept<\u002Fspan>\n              <\u002Fdiv>\n              <sc-for list=\"{{ editionList }}\" as=\"e\" hint-placeholder-count=\"3\">\n                <div class=\"atl-row\" sc-camel-on-click=\"{{ e.select }}\" style=\"{{ e.style }}\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <span style=\"font-family:'Poppins',sans-serif;font-size:15px;font-weight:500;color:#F7F2E9\">Edition {{ e.n }}<\u002Fspan>\n                    <sc-if value=\"{{ e.isCurrent }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#0B141B;background:#E8B96A;padding:2px 7px;border-radius:20px\">Current<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;margin-top:4px\"><span style=\"font-size:10px;color:#8B8271\">{{ e.date }}<\u002Fspan><span style=\"font-size:9px;color:#6E6656\">{{ e.count }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <\u002Fdiv>\n          <div style=\"font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#E8B96A\">Aldar \u00b7 CX Time<\u002Fdiv>\n          <div style=\"font-family:'Poppins',sans-serif;font-size:clamp(28px,3vw,38px);font-weight:300;color:#F7F2E9;line-height:1.12;margin-top:18px;max-width:24ch;text-wrap:pretty;letter-spacing:-.015em\">The best CX thinking, read for you<\u002Fdiv>\n          <div style=\"font-size:15px;font-weight:300;color:rgba(247,242,233,.72);line-height:1.55;margin-top:12px;max-width:52ch;text-wrap:pretty\">Curated this fortnight by Group CX \u2014 read, watched and listened to, with what each piece means for Aldar.<\u002Fdiv>\n          <div data-m=\"stats\" style=\"display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:18px\">\n            <div><span style=\"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#F7F2E9\">{{ statEditions }}<\u002Fspan><span style=\"font-size:11px;color:rgba(247,242,233,.55);margin-left:8px\">Editions<\u002Fspan><\u002Fdiv>\n            <div><span style=\"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#E8B96A\">{{ statPieces }}<\u002Fspan><span style=\"font-size:11px;color:rgba(247,242,233,.55);margin-left:8px\">In this edition<\u002Fspan><\u002Fdiv>\n            <div><span style=\"font-family:'Fraunces',serif;font-size:26px;font-weight:400;color:#F7F2E9\">{{ statFormats }}<\u002Fspan><span style=\"font-size:11px;color:rgba(247,242,233,.55);margin-left:8px\">Formats<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n      <div data-m=\"strip\" style=\"display:flex;width:100%;max-width:760px;margin:14px auto 0;background:rgba(11,20,27,.6);border:1px solid rgba(232,185,106,.34);border-radius:12px;overflow:hidden;backdrop-filter:blur(7px)\">\n        <div style=\"flex:1;min-width:0;padding:13px 16px 17px;text-align:left;border-right:1px solid rgba(247,242,233,.12);\">\n          <div style=\"font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E8B96A\">Read &amp; watch<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:500;color:#F7F2E9;margin-top:4px;line-height:1.25\">Articles, video, podcasts<\u002Fdiv>\n          <div style=\"font-size:10px;color:rgba(247,242,233,.55);margin-top:2px;line-height:1.35\">Every format in one edit<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-width:0;padding:13px 16px 17px;text-align:left;border-right:1px solid rgba(247,242,233,.12);\">\n          <div style=\"font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E8B96A\">Understand<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:500;color:#F7F2E9;margin-top:4px;line-height:1.25\">The so-what for Aldar<\u002Fdiv>\n          <div style=\"font-size:10px;color:rgba(247,242,233,.55);margin-top:2px;line-height:1.35\">On every single piece<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ toggleArchive }}\" style=\"flex:1;min-width:0;padding:13px 16px 17px;text-align:left;cursor:pointer;transition:background .15s\" style-hover=\"background:rgba(232,185,106,.13)\">\n          <div style=\"font-size:7.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E8B96A\">Browse<\u002Fdiv>\n          <div style=\"font-size:12px;font-weight:500;color:#F7F2E9;margin-top:4px;line-height:1.25\">Every past edition<\u002Fdiv>\n          <div style=\"font-size:10px;color:rgba(247,242,233,.55);margin-top:2px;line-height:1.35\">Nothing is overwritten<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n          <div style=\"flex:1;min-height:18px\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ isArchive }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:12px;margin-top:16px;background:rgba(232,185,106,.08);border:1px dashed rgba(232,185,106,.42);border-radius:12px;padding:10px 16px\">\n          <span style=\"font-size:11.5px;color:#DCD4C4;line-height:1.5\">You are viewing a past edition. The current edition is <b style=\"color:#E8B96A\">{{ latestLabel }}<\u002Fb>.<\u002Fspan>\n          <span sc-camel-on-click=\"{{ backToCurrent }}\" style=\"cursor:pointer;margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#0B141B;background:#E8B96A;padding:7px 13px;border-radius:20px;white-space:nowrap\">Back to current \u2192<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div data-m=\"shelf\" style=\"background:radial-gradient(1100px 480px at 82% -120px, rgba(232,185,106,.15), rgba(232,185,106,0) 60%), #17130D;border:1px solid rgba(247,242,233,.1);border-radius:20px;padding:30px 34px 38px;box-shadow:0 22px 54px -30px rgba(0,0,0,.7)\">\n\n\n      <!-- Signal of the week (only on All) \u00b7 2a hero -->\n      <sc-if value=\"{{ isAll }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-atl-lead=\"1\" class=\"atl-card\" sc-camel-on-click=\"{{ lead.select }}\" style=\"cursor:pointer;margin-top:22px;position:relative;aspect-ratio:16/7;min-height:340px;border-radius:12px;overflow:hidden;background:#000;color:#FFFFFF\">\n        <div style=\"{{ lead.img }}\"><\u002Fdiv>\n        <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 40%,rgba(0,0,0,.62) 62%,rgba(0,0,0,.9) 100%)\"><\u002Fdiv>\n        <div data-m=\"leadchips\" style=\"position:absolute;top:18px;left:18px;display:flex;gap:8px;flex-wrap:nowrap\"><span style=\"font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#0A1014;background:#E8B96A;border-radius:999px;padding:5px 11px;white-space:nowrap\">\u2726 Signal of the week<\u002Fspan><span style=\"font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF;background:rgba(0,0,0,.66);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:99
